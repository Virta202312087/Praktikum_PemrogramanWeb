<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toko Elektronik Cepat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f6fa;
    }

    header {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: white;
      border-bottom: 5px solid #ffd700;
    }

    h1 {
      font-weight: 700;
    }

    .carousel img {
      height: 300px;
      object-fit: cover;
      border-radius: 10px;
    }

    #product-list .list-group-item {
      cursor: pointer;
      transition: background 0.3s ease;
    }

    #product-list .list-group-item:hover {
      background-color: #f0f8ff;
      font-weight: 600;
    }

    .form-control:focus {
      border-color: #6a11cb;
      box-shadow: 0 0 0 0.2rem rgba(106, 17, 203, 0.25);
    }

    button.btn-success {
      background-color: #6a11cb;
      border-color: #6a11cb;
    }

    button.btn-success:hover {
      background-color: #4b0da3;
      border-color: #4b0da3;
    }

    .card-title {
      font-weight: 600;
    }

    #order-summary .card {
      background: #fff8dc;
      border-left: 5px solid #6a11cb;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="text-center py-4">
    <h1>Toko Elektronik Cepat</h1>
    <p id="current-time"></p>
  </header>

  <script>
    function updateTime() {
      const now = new Date();
      document.getElementById('current-time').textContent = now.toLocaleString('id-ID');
    }
    setInterval(updateTime, 1000);
    updateTime();
  </script>

  <!-- Produk & Daftar -->
  <div class="container mt-5">
    <div class="row g-5">
      <div class="col-md-6">
        <div id="product-slideshow" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel">
          <div class="carousel-inner" id="carousel-images"></div>
          <button class="carousel-control-prev" type="button" data-bs-target="#product-slideshow" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#product-slideshow" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
        <h3 id="product-name" class="mt-3 text-primary"></h3>
        <p id="product-price" class="fw-semibold fs-5"></p>
      </div>

      <div class="col-md-6">
        <h4 class="mb-3">Daftar Produk</h4>
        <ul id="product-list" class="list-group shadow-sm"></ul>
      </div>
    </div>
  </div>

  <!-- Form Pemesanan -->
  <div class="container mt-5">
    <div class="p-4 bg-white rounded shadow-sm">
      <h4 class="mb-4">Form Pemesanan</h4>
      <form id="order-form">
        <div class="mb-3">
          <label for="customer-name" class="form-label">Nama Pemesan</label>
          <input type="text" id="customer-name" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="quantity" class="form-label">Jumlah Pesan</label>
          <input type="number" id="quantity" class="form-control" required min="1" />
        </div>
        <div class="mb-3">
          <label for="promo-code" class="form-label">Kode Promo</label>
          <input type="text" id="promo-code" class="form-control" />
        </div>
        <button type="button" class="btn btn-success px-4" onclick="placeOrder()">Pesan Sekarang</button>
      </form>
    </div>
  </div>

  <!-- Output -->
  <div id="order-summary" class="container mt-4 mb-5"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const products = [
      {
        name: "Nokia 3310",
        price: 300000,
        images: ["assets/nokia3310-1.jpg", "assets/nokia3310-2.jpg", "assets/nokia3310-3.jpg"]
      },
      {
        name: "Motorola Razr",
        price: 650000,
        images: ["assets/razr-1.jpg", "assets/razr-2.jpg", "assets/razr-3.jpg"]
      },
      {
        name: "Sony Ericsson T610",
        price: 550000,
        images: ["assets/t610-1.jpg", "assets/t610-2.jpg", "assets/t610-3.jpg"]
      }
    ];

    let currentProductIndex = 0;

    function showProduct(index) {
      currentProductIndex = index;
      const product = products[index];
      const carouselInner = document.getElementById("carousel-images");
      carouselInner.innerHTML = product.images.map((img, i) => `
        <div class="carousel-item ${i === 0 ? "active" : ""}">
          <img src="${img}" class="d-block w-100" alt="${product.name}">
        </div>
      `).join("");

      document.getElementById("product-name").textContent = product.name;
      document.getElementById("product-price").textContent = `Harga: Rp ${product.price.toLocaleString('id-ID')}`;
    }

    function showProductList() {
      const list = document.getElementById("product-list");
      list.innerHTML = products.map((product, i) => `
        <li class="list-group-item" onclick="showProduct(${i})">${product.name}</li>
      `).join("");
    }

    function placeOrder() {
      const name = document.getElementById("customer-name").value;
      const qty = parseInt(document.getElementById("quantity").value);
      const promo = document.getElementById("promo-code").value.toUpperCase();
      const product = products[currentProductIndex];

      if (!name || qty <= 0) {
        alert("Nama pemesan dan jumlah harus diisi dengan benar.");
        return;
      }

      const subtotal = product.price * qty;
      let discount = 0;
      if (promo === "DISKON10") {
        discount = subtotal * 0.10;
      }
      const total = subtotal - discount;
      const orderId = "INV-" + Math.floor(10000 + Math.random() * 90000);

      document.getElementById("order-summary").innerHTML = `
        <div class="card shadow mt-4">
          <div class="card-body">
            <h5 class="card-title text-primary">Struk Pesanan</h5>
            <p><strong>Order ID:</strong> ${orderId}</p>
            <p><strong>Nama Pemesan:</strong> ${name}</p>
            <p><strong>Produk:</strong> ${product.name}</p>
            <p><strong>Jumlah:</strong> ${qty}</p>
            <p><strong>Subtotal:</strong> Rp ${subtotal.toLocaleString('id-ID')}</p>
            <p><strong>Diskon:</strong> Rp ${discount.toLocaleString('id-ID')}</p>
            <p><strong>Total Akhir:</strong> Rp ${total.toLocaleString('id-ID')}</p>
          </div>
        </div>
      `;
    }

    showProduct(0);
    showProductList();
  </script>
</body>
</html>
